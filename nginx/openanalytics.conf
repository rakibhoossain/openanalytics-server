# ==============================================================================
# OpenAnalytics Production Reverse Proxy Configuration
# Place this file in /etc/nginx/sites-available/openanalytics.conf
# and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

upstream openanalytics_ingest {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream openanalytics_query {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name track.aicart.store analytics.aicart.store; # <-- Replace with your domain

    # Redirect all HTTP traffic to HTTPS (uncomment once SSL certificate is issued)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --------------------------------------------------------------------------
    # 1. High-throughput Ingest API (/api/v1/track*, /track*, /events*)
    # --------------------------------------------------------------------------
    location ~* ^/(api/v1/track|track|event|events) {
        proxy_pass http://openanalytics_ingest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Real Client IP propagation (Crucial for GeoIP & Device Parsing)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Low latency timeouts for event collection
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Disable buffering for instant ingest acknowledgment
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. WebSocket Real-time Live Streams (/live/events, /live/visitors, /ws)
    # --------------------------------------------------------------------------
    location ~* ^/(live|api/live|ws) {
        proxy_pass http://openanalytics_query;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket streaming keepalive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 3. Query API & Analytics Engine (Default fallback)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://openanalytics_query;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

